<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OVERLAY — Draft 3D</title>
<style>
  /* R99 · paleta del HUD. El panel manda el azul y el rojo de los equipos y
     aquí se calculan los claros y los bordes (el draft no tiene dorado). Si el
     panel no manda nada, estos son los de fábrica y todo se ve como siempre. */
  :root {
    --hud-azul: #3b82f6;
    --hud-azul-claro: #60a5fa;
    --hud-azul-borde: #1e3a8a;
    --hud-rojo: #ef4444;
    --hud-rojo-claro: #f87171;
    --hud-rojo-borde: #7f1d1d;
    --hud-azul-rgb: 59 130 246;
    --hud-rojo-rgb: 239 68 68;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
  #ui { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; font-family: system-ui; color: #fff; text-shadow: 0 2px 8px #000; pointer-events: none; }
  .slot { background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 8px; font-size: 14px; }

  #draftbar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: flex-end; gap: 26px;
    font-family: system-ui; pointer-events: none;
    transform-origin: bottom center;
  }
  .teamcol { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  /* ===== PATROCINADORES: uno a cada lado del logo del torneo =====
     Van en posicion absoluta dentro de #draftbar, asi que NO ocupan sitio: el
     resto del draft se queda exactamente donde estaba. El hueco bueno es la
     franja de los baneos (los baneos van pegados a las orillas y por dentro
     queda libre), a la altura del logo. bottom = alto de las cartas (208) +
     la separacion (10): asi la franja cae justo sobre los baneos aunque el
     bloque central cambie de alto. */
  .sponsor {
    position: absolute; bottom: 218px; height: 78px; width: 340px;
    display: flex; align-items: center;
    opacity: 0; transition: opacity .4s ease; pointer-events: none;
  }
  .sponsor.on { opacity: 1; }
  .sponsor.left { right: calc(50% + 254px); justify-content: flex-end; }
  .sponsor.right { left: calc(50% + 254px); justify-content: flex-start; }
  .sponsor img {
    max-height: 100%; max-width: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.7));
  }
  .teamcol.team-blue { align-items: flex-start; }
  .teamcol.team-red { align-items: flex-end; }
  .team-boxes { display: flex; gap: 10px; }
  .pbox {
    width: 156px; height: 208px; border-radius: 14px;
    background: rgba(5,8,15,.75);
    border: 3px solid var(--hud-azul-borde);
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
    overflow: hidden; position: relative;
  }
  .team-red .pbox { border-color: var(--hud-rojo-borde); }
  .pbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* R97 · PRESELECCIÓN (hover del jugador en el cliente de LoL): se ve SOLO en
     la carta 2D, atenuada y con el borde punteado, para que nadie la confunda
     con un campeón ya elegido. Nunca crea el campeón 3D: eso llega al confirmar. */
  .pbox.preview { border-style: dashed; border-color: #94a3b8; }
  .pbox img.preview { opacity: .45; filter: grayscale(.45) brightness(.9); }
  .pbox .pname {
    position: absolute; bottom: 0; left: 0; right: 0;
    font-size: 16px; font-weight: 700; text-align: center; color: #fff;
    background: rgba(0,0,0,.65); padding: 5px 0;
    text-shadow: 0 1px 3px #000;
  }

  .ban-boxes { display: flex; gap: 8px; }
  .bbox {
    width: 78px; height: 78px; border-radius: 10px;
    background: rgba(5,8,15,.7);
    border: 2px solid var(--hud-azul-borde);
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
    overflow: hidden; position: relative;
  }
  .team-red .bbox { border-color: var(--hud-rojo-borde); }
  .bbox img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(.6) brightness(.85); }
  .bbox::after {
    content: '✕'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 900; color: rgb(var(--hud-rojo-rgb) / 90%);
    text-shadow: 0 2px 6px #000;
  }

  /* ===== USADOS (FEARLESS DRAFT) — esquinas superiores, cuadrícula fija de 5 cols ===== */
  #blueUsed, #redUsed {
    position: fixed;
    top: 12px;
    display: grid;
    grid-template-columns: repeat(5, 40px);
    gap: 4px;
    z-index: 10;
    pointer-events: none;
  }
  #blueUsed { left: 12px; }
  #redUsed { right: 12px; }
  .ubox {
    width: 40px; height: 40px; border-radius: 6px;
    background: rgba(5,8,15,.75);
    border: 2px solid var(--hud-azul-borde);
    box-shadow: 0 3px 10px rgba(0,0,0,.5);
    overflow: hidden; position: relative;
  }
  #redUsed .ubox { border-color: var(--hud-rojo-borde); }
  .ubox img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(.6) saturate(.75); }
  .ubox::after { content: '🔒'; position: absolute; bottom: 1px; right: 2px; font-size: 10px; }

  #centerinfo {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    min-width: 460px; color: #fff; text-align: center;
    text-shadow: 0 2px 8px #000;
  }
  #centerinfo img.logo { height: 140px; max-width: 440px; object-fit: contain; margin-bottom: 8px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.7)); }
  #tournamentName { font-size: 32px; font-weight: 800; letter-spacing: 2px; opacity: .95; }
  #matchTeams { width: 100%; max-width: 460px; display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 5px; font-size: 26px; font-weight: 700; opacity: .9; }
  #matchTeams .tb { flex: 1; min-width: 0; text-align: right; color: var(--hud-azul-claro); line-height: 1.1; overflow-wrap: break-word; }
  #matchTeams .tr { flex: 1; min-width: 0; text-align: left; color: var(--hud-rojo-claro); line-height: 1.1; overflow-wrap: break-word; }
  #matchTeams .vs { font-weight: 900; opacity: .85; letter-spacing: 3px; flex: 0 0 auto; }

   #scoreLine { margin-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #scoreLine .scorerow { display: flex; align-items: center; gap: 20px; }
  #scoreLine b { font-size: 28px; font-weight: 900; letter-spacing: 1px; }
  .pip { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #555; margin: 0 3px; vertical-align: middle; }
  .pip.blue.filled { background: var(--hud-azul); border-color: var(--hud-azul); box-shadow: 0 0 8px var(--hud-azul); }
  .pip.red.filled { background: var(--hud-rojo); border-color: var(--hud-rojo); box-shadow: 0 0 8px var(--hud-rojo); }
  #boLabel { font-size: 14px; font-weight: 800; opacity: .8; letter-spacing: 1px; }

  /* ===== TIMER DEL DRAFT (sincronizado al cliente) ===== */
        /* Franja del timer: toda la zona superior, drena de abajo hacia arriba */
    /* Franja del timer: toda la zona superior, drena de abajo hacia arriba */
  #timerwrap {
    position: fixed; top: 0; left: 0; right: 0; height: 55vh;
    display: none; z-index: -1; pointer-events: none;
    font-family: system-ui; color: #fff; text-shadow: 0 2px 10px #000;
  }
  #timerBar {
    position: absolute; top: 0; left: 0; right: 0; height: 100%;
    transition: height 1s linear;
    display: flex; align-items: center; justify-content: center;
  }
  /* El contenido va CENTRADO dentro de la franja (sube con ella mientras drena) */
    /* El contenido va CENTRADO dentro de la franja y SIEMPRE encima del relleno */
  #timerContent { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #timerNum { font-size: 130px; font-weight: 900; line-height: 1; }
  #timerPhase { font-size: 17px; font-weight: 800; letter-spacing: 3px; opacity: .95; text-transform: uppercase; }
</style>
<!-- ===== R85b · DRAFT 1 VS 1 =================================================
     Todo lo de aquí solo se aplica cuando el panel envía modo = 1v1.
     En 5v5 el body no lleva data-modo-draft="1v1" y no cambia ni un píxel.
     · una sola base (retrato) por lado
     · baneos = los que elija el panel (0, 1 o 3), siguen viéndose junto al jugador
     ========================================================================= -->
<style>
  /* R86 · 1 vs 1: los campeones van en 3D, grandes, a los lados del bloque
     central. Los retratos de la barra (las cartas 2D) no se usan. */
  body[data-modo-draft="1v1"] .team-boxes { display: none; }
  body[data-modo-draft="1v1"] .team-boxes .pbox:nth-child(n+2) { display: none; }
  body[data-modo-draft="1v1"][data-baneos-draft="0"] .ban-boxes { display: none; }
  body[data-modo-draft="1v1"][data-baneos-draft="1"] .ban-boxes .bbox:nth-child(n+2) { display: none; }
  body[data-modo-draft="1v1"][data-baneos-draft="3"] .ban-boxes .bbox:nth-child(n+4) { display: none; }

  /* R86 · LOS BANEOS Y LOS PATROCINADORES.
     En 1 vs 1 los retratos de la barra ya no se usan (los campeones van en 3D),
     así que la fila de baneos baja a la franja de abajo y el patrocinador se
     queda arriba, en su sitio de siempre: medido a 1920 con 0, 1 y 3 baneos, no
     se tocan ni un píxel. */
  body[data-modo-draft="1v1"] .sponsor { z-index: 3; }
</style>
</head>
<body>
<div id="ui"></div>

<div id="timerwrap">
  <div id="timerBar"></div>
  <div id="timerContent"><span id="timerNum"></span><span id="timerPhase"></span></div>
</div>

<!-- Fearless usados: esquinas superiores, fuera del draftbar para no interferir -->
<div id="blueUsed"></div>
<div id="redUsed"></div>

<div id="draftbar">
  <!-- Patrocinadores: uno a cada lado del logo del torneo, en la franja libre
       que queda por dentro de los baneos. No ocupan sitio. -->
  <div class="sponsor left" id="sponsorLeft"></div>
  <div class="sponsor right" id="sponsorRight"></div>
  <div class="teamcol team-blue">
    <div class="ban-boxes" id="blueBans"></div>
    <div class="team-boxes" id="blueBoxes"></div>
  </div>
  <div id="centerinfo">
    <img class="logo" id="tLogo" style="display:none">
    <div id="tournamentName"></div>
    <div id="matchTeams"></div>
    <div id="scoreLine"></div>
  </div>
  <div class="teamcol team-red">
    <div class="ban-boxes" id="redBans"></div>
    <div class="team-boxes" id="redBoxes"></div>
  </div>
</div>


<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== R99 · colores del HUD =====
// Dos colores base (azul y rojo); los claros y los bordes salen de aquí.
// hexANum lo usan también los materiales 3D y el canvas 2D de las etiquetas.
const TEMA_HUD = {
  azul: '#3b82f6', rojo: '#ef4444',
  azulClaro: '#60a5fa', azulBorde: '#1e3a8a',
  rojoClaro: '#f87171', rojoBorde: '#7f1d1d'
};
const HEX_VALIDO = /^#[0-9a-f]{6}$/i;
function hexANum(hex) { return parseInt(String(hex).replace('#', ''), 16); }
function mezclarHex(hex, hacia, factor) {
  const h = String(hex).replace('#', '');
  const t = String(hacia).replace('#', '');
  const canal = (i) => Math.round(parseInt(h.substr(i, 2), 16) + (parseInt(t.substr(i, 2), 16) - parseInt(h.substr(i, 2), 16)) * factor);
  return '#' + [0, 2, 4].map(i => canal(i).toString(16).padStart(2, '0')).join('');
}
function calcularDerivados() {
  TEMA_HUD.azulClaro = mezclarHex(TEMA_HUD.azul, '#ffffff', .45);
  TEMA_HUD.azulBorde = mezclarHex(TEMA_HUD.azul, '#000000', .58);
  TEMA_HUD.rojoClaro = mezclarHex(TEMA_HUD.rojo, '#ffffff', .45);
  TEMA_HUD.rojoBorde = mezclarHex(TEMA_HUD.rojo, '#000000', .58);
}
function aplicarTemaHUD(tema) {
  if (!tema || typeof tema !== 'object') return;
  // El draft no tiene dorado: aquí solo se mueven el azul y el rojo.
  const cambiado = ['azul', 'rojo'].filter(clave => {
    const valor = String(tema[clave] || '').trim();
    if (!HEX_VALIDO.test(valor)) return false;
    TEMA_HUD[clave] = valor.toLowerCase();
    return true;
  });
  if (!cambiado.length) return;
  calcularDerivados();
  const raiz = document.documentElement.style;
  raiz.setProperty('--hud-azul', TEMA_HUD.azul);
  raiz.setProperty('--hud-azul-claro', TEMA_HUD.azulClaro);
  raiz.setProperty('--hud-azul-borde', TEMA_HUD.azulBorde);
  raiz.setProperty('--hud-rojo', TEMA_HUD.rojo);
  raiz.setProperty('--hud-rojo-claro', TEMA_HUD.rojoClaro);
  raiz.setProperty('--hud-rojo-borde', TEMA_HUD.rojoBorde);
  const canales = (hex) => { const h = hex.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)).join(' '); };
  raiz.setProperty('--hud-azul-rgb', canales(TEMA_HUD.azul));
  raiz.setProperty('--hud-rojo-rgb', canales(TEMA_HUD.rojo));
  // Lo que ya estaba creado en 3D no se repinta solo: luces y pedestales.
  if (typeof rimBlue !== 'undefined' && rimBlue) rimBlue.color.set(TEMA_HUD.azul);
  if (typeof rimRed !== 'undefined' && rimRed) rimRed.color.set(TEMA_HUD.rojo);
  if (typeof pedestales !== 'undefined' && pedestales) {
    pedestales.blue.forEach(p => p.material.emissive.set(TEMA_HUD.azulBorde));
    pedestales.red.forEach(p => p.material.emissive.set(TEMA_HUD.rojoBorde));
  }
  if (typeof ring !== 'undefined' && ring && !activePick) ring.material.color.set(TEMA_HUD.azulClaro);
}

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x23262e, 14, 48);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 100);
camera.position.set(0, 2.4, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
// (r72) En OBS el navegador va a 1x, así que esto no cambia nada del directo.
// En un navegador normal, con la pantalla escalada al 150% o 200%, se pintaba a
// 1.5x o 2x: entre 2 y 4 veces más píxeles para la tarjeta, y con el draft en
// una pestaña eso se lleva por delante el vídeo de Twitch y YouTube.
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);


const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.autoRotate = false;
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0x8899bb, 2.0));
const key = new THREE.SpotLight(0xffffff, 600, 60, Math.PI/3, .6); key.position.set(0, 12, 8); scene.add(key);
const rimBlue = new THREE.PointLight(hexANum(TEMA_HUD.azul), 300, 60); rimBlue.position.set(-11, 4, 2); scene.add(rimBlue);
const rimRed  = new THREE.PointLight(hexANum(TEMA_HUD.rojo), 300, 60); rimRed.position.set(11, 4, 2); scene.add(rimRed);
const fill = new THREE.DirectionalLight(0xffffff, 1.4); fill.position.set(0, 6, 12); scene.add(fill);

const podium = new THREE.Mesh(
  new THREE.CylinderGeometry(1.7, 2.0, .35, 48),
  new THREE.MeshStandardMaterial({ color: 0x2a2e39, metalness: .7, roughness: .35 })
);
podium.position.y = -.175; scene.add(podium);
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x3a3f4a, metalness: .35, roughness: .6 }));
floor.rotation.x = -Math.PI/2; floor.position.y = -.36; scene.add(floor);
const ring = new THREE.Mesh(new THREE.TorusGeometry(2.2, .04, 16, 100),
  new THREE.MeshBasicMaterial({ color: hexANum(TEMA_HUD.azulClaro) }));
ring.rotation.x = Math.PI/2; ring.position.y = .01; scene.add(ring);

// ===== R86 · MODO DEL DRAFT =====
// El panel manda info.modo ('5v5' | '1v1' | '2v2') y info.baneos (0 | 1 | 3).
// Por defecto 5v5: si el panel no dice nada, todo funciona como siempre.
// Se declara ARRIBA porque lineupPos() ya necesita saber el modo al cargar.
let modoDraft = '5v5';
let baneosDraft = 5;
const es1v1 = () => modoDraft === '1v1';
const maxFichas = () => (es1v1() ? 1 : 5);
const maxBaneos = () => (es1v1() ? baneosDraft : 5);

// En 1v1 no hay podio: los dos campeones salen a la vez, cada uno en su base.
const reserva1v1 = { blue: null, red: null };

// R86 · encuadre del 1 vs 1: dos campeones GRANDES a los lados del bloque
// central de la barra, con su nombre de invocador debajo.
const CINE_1V1 = {
  x: 5.1,          // R87 · a las orillas, por fuera de los patrocinadores
  z: 3.2,          // más cerca de la cámara = más grandes
  escala: 1.45,    // el muñeco, un 45 % más grande que en el 5 vs 5
  cam: [0, 2.1, 12.4],
  tgt: [0, 1.75, 3.2]
};
const CARTEL_1V1 = { ancho: 2.1, alto: 0.5 };   // el cartel del nombre, bajo los pies
const rosterActual = { blue: [], red: [] };
const etiquetas1v1 = { blue: null, red: null };

function lineupPos(team, i) {
  if (es1v1()) {
    // R86 · 1 vs 1: una sola base por lado, cerca de la cámara y abierta a los
    // lados, para que el campeón se vea grande.
    return new THREE.Vector3((team === 'blue' ? -1 : 1) * CINE_1V1.x, -0.25, CINE_1V1.z);
  }
  const spread = 2.0;
  const x = (team === 'blue' ? -1 : 1) * (2.7 + i * spread);
  const z = 1.2 - i * 0.55;
  return new THREE.Vector3(x, -0.25, z);
}
const pedestales = { blue: [], red: [] };
for (let t = 0; t < 2; t++) {
  const team = t === 0 ? 'blue' : 'red';
  for (let i = 0; i < 5; i++) {
    const d = new THREE.Mesh(new THREE.CylinderGeometry(.85, .95, .06, 32),
      new THREE.MeshStandardMaterial({
        color: 0x14161d, metalness: .8, roughness: .3,
        emissive: team === 'blue' ? hexANum(TEMA_HUD.azulBorde) : hexANum(TEMA_HUD.rojoBorde), emissiveIntensity: .25
      }));
    const p = lineupPos(team, i);
    d.position.set(p.x, -.33, p.z);
    scene.add(d);
    pedestales[team].push(d);
  }
}

const banCounters = { blue: 0, red: 0 };
let ddragonVer = null;
fetch('https://ddragon.leagueoflegends.com/api/versions.json')
  .then(r => r.json()).then(v => ddragonVer = v[0]).catch(() => {});

const NAME_TO_ID = {
  "Aurelion Sol": "AurelionSol", "Bel'Veth": "Belveth", "Cho'Gath": "Chogath",
  "Dr. Mundo": "DrMundo", "Jarvan IV": "JarvanIV",
  "K'Sante": "KSante", "Kai'Sa": "Kaisa", "Kha'Zix": "Khazix",
  "Kog'Maw": "KogMaw", "LeBlanc": "Leblanc", "Lee Sin": "LeeSin",
  "Master Yi": "MasterYi", "Miss Fortune": "MissFortune", "Nunu & Willump": "Nunu",
  "Rek'Sai": "RekSai", "Renata Glasc": "Renata", "Tahm Kench": "TahmKench",
  "Twisted Fate": "TwistedFate", "Vel'Koz": "Velkoz", "Wukong": "MonkeyKing"
};
function champId(name) {
  if (NAME_TO_ID[name]) return NAME_TO_ID[name];
  return name.charAt(0).toUpperCase() + name.slice(1).replace(/[^a-zA-Z0-9]/g, '');
}

function buildBoxes(team) {
  const wrap = document.getElementById(team + 'Boxes');
  for (let i = 0; i < 5; i++) {
    const box = document.createElement('div');
    box.className = 'pbox';
    wrap.appendChild(box);
  }
}
function buildBanBoxes(team) {
  const wrap = document.getElementById(team + 'Bans');
  for (let i = 0; i < 5; i++) {
    const box = document.createElement('div');
    box.className = 'bbox';
    wrap.appendChild(box);
  }
}
buildBoxes('blue'); buildBoxes('red');
buildBanBoxes('blue'); buildBanBoxes('red');

function fitBar() {
  const bar = document.getElementById('draftbar');
  const s = Math.min(1, (innerWidth - 40) / bar.scrollWidth);
  bar.style.transform = `translateX(-50%) scale(${s})`;
}
fitBar();

function champImg(name) {
  const ver = ddragonVer || '15.1.1';
  const img = document.createElement('img');
  img.src = `https://ddragon.leagueoflegends.com/cdn/${ver}/img/champion/${champId(name)}.png`;
  img.onerror = () => { img.remove(); };
  return img;
}

// ===== R97 · PRESELECCIONES (hover) ==========================================
// El jugador marca un campeón en el cliente de LoL y muchas veces lo cambia
// antes de confirmar. La preselección se enseña SOLO en la carta 2D, atenuada.
// El campeón 3D no aparece hasta el pick confirmado. En 1 vs 1 no hay cartas
// 2D visibles, así que ahí no se enseña nada hasta confirmar.
//
// Cada celda del draft (0..4 azul, 5..9 rojo) tiene su carta: el jugador de esa
// celda es siempre el mismo, así que la preselección va a su carta y no a la
// primera libre (que es lo que hace el pick cuando llega sin puesto).
const preselecciones = { blue: new Map(), red: new Map() };   // celda -> { champion, box }

function olvidarPreseleccionDeCaja(team, box) {
  for (const [celda, v] of preselecciones[team]) {
    if (v.box === box) preselecciones[team].delete(celda);
  }
}

function cartaDeLaCelda(team, celda, role) {
  const boxes = [...document.querySelectorAll(`#${team}Boxes .pbox`)];
  const i = slotForRole(role);
  if (i != null && boxes[i]) return boxes[i];
  const deCelda = boxes[celda < 5 ? celda : celda - 5];
  if (deCelda) return deCelda;
  return boxes.find(b => !b.querySelector('img')) || null;
}

function quitarPreseleccion(team, celda) {
  const previa = preselecciones[team].get(celda);
  if (!previa) return;
  preselecciones[team].delete(celda);
  const box = previa.box;
  if (!box) return;
  box.querySelectorAll('img.preview').forEach(im => im.remove());
  if (!box.querySelector('img')) box.classList.remove('preview');
}

function pintarPreseleccion(msg) {
  const team = msg.team === 'red' ? 'red' : 'blue';
  const celda = Number(msg.cell);
  if (!Number.isFinite(celda)) return;
  if (es1v1()) { quitarPreseleccion(team, celda); return; }   // 1 vs 1: sin 2D
  if (!msg.champion) { quitarPreseleccion(team, celda); return; }
  const previa = preselecciones[team].get(celda);
  if (previa && previa.champion === msg.champion) return;     // ya está puesta
  quitarPreseleccion(team, celda);
  const box = cartaDeLaCelda(team, celda, msg.role);
  if (!box) return;
  if (box.dataset.champ === msg.champion) return;             // ya confirmado: manda el pick
  if (box.querySelector('img:not(.preview)')) return;         // esa carta ya es de un pick
  const im = champImg(msg.champion);
  im.classList.add('preview');
  im.dataset.preview = msg.champion;
  box.appendChild(im);
  box.classList.add('preview');
  preselecciones[team].set(celda, { champion: msg.champion, box });
}

function fillBox(team, name, player, role) {
  const boxes = document.querySelectorAll(`#${team}Boxes .pbox`);
  let i = (!es1v1() && role) ? slotForRole(role) : null;
  // R97 · una preselección (img.preview) NO ocupa el hueco: el campeón
  // confirmado entra igual y la preselección se va.
  if (i == null || !boxes[i] || boxes[i].querySelector('img:not(.preview)')) {
    i = [...boxes].findIndex(b => !b.querySelector('img:not(.preview)'));
    if (i < 0) return;
  }
  const box = boxes[i];
  box.querySelectorAll('img.preview').forEach(im => im.remove());
  if (!box.querySelector('img')) box.classList.remove('preview');
  olvidarPreseleccionDeCaja(team, box);
  const im = champImg(name);
  im.dataset.champ = name;
  box.appendChild(im);
  box.dataset.champ = name;
  // R85b · 1v1: si el cliente no ha dado nombre, el hueco del invocador se crea
  // igualmente para que el nombre del roster (LoL) tenga dónde ir.
  let nm = box.querySelector('.pname');
  if (!nm && es1v1()) { nm = document.createElement('span'); nm.className = 'pname'; box.appendChild(nm); }
  if (nm && !nm.textContent && player) nm.textContent = player;
}

function fillBanBox(team, name) {
  const i = Math.min(banCounters[team], 4);
  banCounters[team]++;
  const box = document.querySelectorAll(`#${team}Bans .bbox`)[i];
  if (box) box.appendChild(champImg(name));
}

// R97b · LA FILA DE BANEOS ENTERA. Al abrir el overlay (o al recargarlo) se
// repintan los baneos que ya habían pasado; antes solo se repintaban los
// campeones, así que la fila se quedaba a medias (salían 1 o 3 de 5).
let firmaBans = null;
function pintarBans(lista) {
  const buena = (lista || []).filter(b => b && b.champion);
  const porEquipo = { blue: 0, red: 0 };
  const firma = buena.map(b => {
    const team = b.team === 'red' ? 'red' : 'blue';
    if (porEquipo[team] >= maxBaneos()) return '';
    porEquipo[team]++;
    return `${team}|${b.champion}`;
  }).filter(Boolean).join(',');
  if (firma === firmaBans) return;      // ya está igual: no se toca (sin parpadeos)
  firmaBans = firma;
  banCounters.blue = 0; banCounters.red = 0;
  document.querySelectorAll('.ban-boxes .bbox').forEach(b => { b.innerHTML = ''; });
  buena.forEach(b => {
    const team = b.team === 'red' ? 'red' : 'blue';
    if (banCounters[team] >= maxBaneos()) return;
    fillBanBox(team, b.champion);
  });
}

function dibujarEtiqueta1v1(l) {
  const g = l.cv.getContext('2d');
  const W = l.cv.width, H = l.cv.height;
  g.clearRect(0, 0, W, H);
  g.fillStyle = 'rgba(5,8,15,.88)';
  g.strokeStyle = l.team === 'blue' ? TEMA_HUD.azul : TEMA_HUD.rojo;
  g.lineWidth = 10;
  roundRect(g, 8, 8, W - 16, H - 16, 26);
  g.fill(); g.stroke();
  let size = 66;
  do { g.font = `bold ${size}px system-ui, sans-serif`; size -= 2; }
  while (size > 22 && g.measureText(l.nombre).width > W - 64);
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(l.nombre, W / 2, H / 2 + 3);
  l.sp.material.map.needsUpdate = true;
}

function aplicarModoDraft(data) {
  const modo = String((data && (data.modo || data.modoPartida)) || '').toLowerCase();
  const modoNuevo = (modo === '1v1' || modo === '2v2') ? modo : '5v5';
  const b = Number(data && data.baneos);
  const cambioDeModo = modoNuevo !== modoDraft;
  modoDraft = modoNuevo;
  baneosDraft = ([0, 1, 3].includes(b)) ? b : 5;
  document.body.dataset.modoDraft = modoDraft === '5v5' ? '' : modoDraft;
  document.body.dataset.baneosDraft = String(maxBaneos());
  // Bases 3D: en 1v1 queda una por lado (más grande), en el resto las cinco.
  const n = maxFichas();
  ['blue', 'red'].forEach(team => {
    (pedestales[team] || []).forEach((d, i) => {
      d.visible = i < n;
      if (i === 0) {
        const p = lineupPos(team, 0);
        d.position.set(p.x, -.33, p.z);
        d.scale.setScalar(es1v1() ? 1.35 : 1);
      }
    });
  });
  // Con el modo 1 vs 1: la escena cambia de encuadre y no hay podio ni líneas.
  if (es1v1()) {
    if (cambioDeModo) {
      camera.position.set(CINE_1V1.cam[0], CINE_1V1.cam[1], CINE_1V1.cam[2]);
      controls.target.set(CINE_1V1.tgt[0], CINE_1V1.tgt[1], CINE_1V1.tgt[2]);
      controls.update();
      reserva1v1.blue = null; reserva1v1.red = null;
    }
  } else if (cambioDeModo) {
    // Al volver a 5 vs 5 se devuelve la cámara de siempre (y solo al cambiar de
    // modo: si no, cada vez que llegara un info se perdería la vista que hayas
    // movido con el ratón).
    camera.position.set(0, 2.4, 14);
    controls.target.set(0, 0.85, 0);
    controls.update();
    quitarEtiqueta1v1('blue'); quitarEtiqueta1v1('red');
    reserva1v1.blue = null; reserva1v1.red = null;
  }
  if (podium) podium.visible = !es1v1();
  if (ring) ring.visible = !es1v1();
  // En 1v1 no hay líneas: fuera las etiquetas TOP/JG/MID/ADC/SUP de las bases que
  // ya no existen (quedan solo las 2 bases, una por lado).
  try { laneLabels.forEach(l => { l.sp.visible = !es1v1(); }); } catch (e) {}
  try { fitBar(); } catch (e) {}
}

  TOP: 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/icon-position-top.png',
  JUNGLE: 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/icon-position-jungle.png',
  MIDDLE: 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/icon-position-middle.png',
  BOTTOM: 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/icon-position-bottom.png',
  UTILITY: 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/icon-position-utility.png'
};
const roleIcons = {};
const laneLabels = [];
Object.entries(ROLE_ICON).forEach(([k, src]) => {
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => { roleIcons[k] = im; laneLabels.forEach(l => { if (l.role === k) drawLaneLabel(l); }); };
  im.src = src;
});
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawLaneLabel(l) {
  const { sp, role, team } = l;
  const cv = sp.userData.cv, g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  g.fillStyle = 'rgba(5,8,15,.85)';
  g.strokeStyle = team === 'blue' ? TEMA_HUD.azul : TEMA_HUD.rojo;
  g.lineWidth = 8;
  roundRect(g, 6, 6, cv.width - 12, cv.height - 12, 18);
  g.fill(); g.stroke();
  const icon = roleIcons[role];
  if (icon) g.drawImage(icon, 20, 20, 72, 72);
  g.fillStyle = '#fff'; g.font = 'bold 50px system-ui';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(ROLE_TXT[role], cv.width / 2 + 32, cv.height / 2 + 4);
  sp.material.map.needsUpdate = true;
}
function makeLaneLabel(role, team, pos) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 112;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
  sp.scale.set(1.35, 0.55, 1);
  sp.userData.cv = cv;
  sp.position.set(pos.x, pos.y - 0.80, pos.z);
  const l = { sp, role, team };
  drawLaneLabel(l);
  scene.add(sp);
  laneLabels.push(l);
}
// Crear las 10 etiquetas fijas (5 por equipo), siempre visibles
for (let t = 0; t < 2; t++) {
  const team = t === 0 ? 'blue' : 'red';
  ROLE_ORDER.forEach((role, i) => makeLaneLabel(role, team, lineupPos(team, i)));
}
function slotForRole(role) { const i = ROLE_ORDER.indexOf(role); return i < 0 ? null : i; }
function nextSlot(team, preferred, exclude) {
  if (es1v1()) return 0;
  const used = new Set((holdersByTeam[team] || []).filter(h => h !== exclude).map(h => h.userData.slot));
  if (preferred != null && !used.has(preferred)) return preferred;
  for (let i = 0; i < 5; i++) if (!used.has(i)) return i;
  return 4;
}
// Cambia el destino del campeón sin mover a ningún otro.
// Durante la espera solo actualiza la reserva; no lo adelanta al podio ni a su equipo.
function moveHolderToSlot(team, holder, i) {
  holder.userData.slot = i;
  if (holder.userData.pending) return;
  holder.userData.target = lineupPos(team, i);
  holder.userData.targetRot = (team === 'blue' ? .5 : -.5) + (ROT_FIX[holder.userData.champName] || 0);
}
// Intercambia los retratos 2D de dos recuadros (los nombres de jugador quedan fijos)
function swap2D(team, name, i) {
  const boxes = [...document.querySelectorAll(`#${team}Boxes .pbox`)];
  const boxA = boxes.find(b => b.dataset.champ === name);
  const boxB = boxes[i];
  if (!boxA || !boxB || boxA === boxB) return;
  const imgA = boxA.querySelector('img:not(.preview)');
  const imgB = boxB.querySelector('img:not(.preview)');
  if (imgB) boxA.appendChild(imgB);
  if (imgA) boxB.appendChild(imgA);
  // R97 · si en alguna de las dos había una preselección, se va: esa carta ya
  // es de un campeón confirmado.
  [boxA, boxB].forEach(box => {
    box.querySelectorAll('img.preview').forEach(im => im.remove());
    if (!box.querySelector('img')) box.classList.remove('preview');
    olvidarPreseleccionDeCaja(team, box);
  });
  const cA = imgB ? imgB.dataset.champ : '';
  const cB = imgA ? imgA.dataset.champ : '';
  if (cA) boxA.dataset.champ = cA; else delete boxA.dataset.champ;
  if (cB) boxB.dataset.champ = cB; else delete boxB.dataset.champ;
}
// Swap / asignación: el CAMPEÓN se mueve al slot fijo del jugador (las etiquetas jamás se mueven)
function setRole(team, name, role) {
  const i = slotForRole(role);
  if (i == null) return;
  const holder = (holdersByTeam[team] || []).find(h => h.userData.champName === name);
  if (holder && holder.userData.slot !== i) {
    // Cambia solamente su reserva; nunca intercambia el lugar de otro campeón.
    moveHolderToSlot(team, holder, i);
  }
  swap2D(team, name, i);
}

function loadModelInto(holder, team, name) {
  loader.load(`/models/${name}.glb`, (gltf) => {
    const model = gltf.scene;
    holder.add(model);
    // Pre-escala en frío por huesos (pose de reposo): nace casi a tamaño final, sin "pop"
    holder.updateMatrixWorld(true);
    {
      const hs = holder.scale.y || 1;
      const ys = [];
      const v = new THREE.Vector3();
      const seen = new Map();
      model.traverse(n => { if (n.isSkinnedMesh) n.skeleton.bones.forEach(b => { if (!seen.has(b.uuid)) seen.set(b.uuid, b); }); });
      seen.forEach(b => { b.getWorldPosition(v); ys.push(v.y / hs); });
      ys.sort((a, b) => a - b);
      const p = q => ys[Math.min(ys.length - 1, Math.floor(ys.length * q))];
      let h0 = p(.97) - p(.03);
      if (!(h0 > 0.0001) || ys.length < 4) {
        const bb = new THREE.Box3().setFromObject(model);
        h0 = bb.getSize(new THREE.Vector3()).y / hs;
      }
      if (h0 > 0.0001) model.scale.multiplyScalar((2.2 * (SCALE_FIX[name] || 1)) / h0);
    }
    if (gltf.animations.length) {
      const mixer = new THREE.AnimationMixer(model);
      mixer.clipAction(gltf.animations[0]).play();
      mixer.update(1.2); // saltar la pose transitoria: nacer ya con la idle asentada
      mixerHolder.push(mixer);
      holder.userData.normAt = performance.now() + 150;
    } else {
      holder.userData.normAt = performance.now() + 1200;
    }
    holder.userData.normModel = model;
  }, undefined, () => {
    const ph = new THREE.Mesh(new THREE.CapsuleGeometry(.5, 1, 8, 16),
      new THREE.MeshStandardMaterial({ color: team === 'blue' ? hexANum(TEMA_HUD.azul) : hexANum(TEMA_HUD.rojo) }));
    ph.position.y = 1.1; holder.add(ph);
  });
}

// ===== Fila de presentación: un solo campeón en el podio principal =====
const pickQueue = [];
let activePick = null;
let draftGeneration = 0;
let draftEndRequested = false;

function pumpPickQueue() {
  if (activePick) return;
  const next = pickQueue.shift();
  if (!next) return;
  const { holder, team, name, generation } = next;
  if (generation !== draftGeneration || holder.userData.cancelled) {
    pumpPickQueue();
    return;
  }

  activePick = holder;
  ring.material.color.set(team === 'blue' ? hexANum(TEMA_HUD.azul) : hexANum(TEMA_HUD.rojo));
  logUI(`🎬 Pick ${team === 'blue' ? '🔵' : '🔴'}: ${name}`);
  scene.add(holder);

  setTimeout(() => {
    // Un undo o una limpieza invalida esta presentación sin tocar el draft nuevo.
    if (generation !== draftGeneration || holder.userData.cancelled) return;
    pending[team]--;
    holder.userData.pending = false;
    holder.userData.normAt = performance.now() + 300;
    const i = holder.userData.slot;
    counters[team]++;
    holder.userData.target = lineupPos(team, i);
    holder.userData.targetRot = (team === 'blue' ? .5 : -.5) + (ROT_FIX[name] || 0);
    checkDraftComplete();
  }, 3000);
}

// El cierre cinematográfico espera a que todos los picks hayan salido del podio.
function finishDraftWhenReady() {
  if (!draftEndRequested || draftDone) return;
  if (activePick || pickQueue.length) {
    setTimeout(finishDraftWhenReady, 250);
    return;
  }
  draftEndRequested = false;
  endDraftShow();
}

// R85b · Los dos campeones del 1v1 aparecen AL MISMO TIEMPO, cada uno en su base.
function revelar1v1SiListo() {
  if (!es1v1()) return;
  const azul = reserva1v1.blue, rojo = reserva1v1.red;
  if (!azul || !rojo) return;
  if (azul.holder.userData.cancelled || rojo.holder.userData.cancelled) return;
  reserva1v1.blue = null; reserva1v1.red = null;
  [azul, rojo].forEach(e => {
    const { holder, team, name, player } = e;
    pending[team] = Math.max(0, pending[team] - 1);
    holder.userData.pending = false;
    const p = lineupPos(team, 0);
    holder.position.copy(p);
    holder.rotation.y = (team === 'blue' ? .5 : -.5) + (ROT_FIX[name] || 0);
    holder.userData.target = p;
    holder.userData.targetRot = holder.rotation.y;
    holder.userData.normAt = performance.now() + 300;
    holder.userData.escalaFinal = CINE_1V1.escala;
    holder.scale.setScalar(.01);
    scene.add(holder);
    counters[team]++;
    fillBox(team, name, player, null);
    ponerEtiqueta1v1(team, nombreDelJugador(team, player));
    logUI(`🎬 1 VS 1 · ${team === 'blue' ? '🔵' : '🔴'} ${name}`);
  });
  checkDraftComplete();
}

function showChampion(team, name, instant = false, role = null, player = null) {
  if (counters[team] + pending[team] >= maxFichas()) {
    logUI(`⚠️ Máximo 5 picks para el equipo ${team === 'blue' ? 'azul' : 'rojo'}`);
    return;
  }
  if (!es1v1()) fillBox(team, name, player, role);  // en 1v1 se pinta al revelar los dos
  const holder = new THREE.Group();
  holder.name = `champ-${champCount++}`;
  holder.userData.team = team;
  holder.userData.champName = name;
  loadModelInto(holder, team, name);

  if (instant) {
    const i = nextSlot(team, role ? slotForRole(role) : null, holder);
    holder.userData.slot = i;
    counters[team]++;
    holder.position.copy(lineupPos(team, i));
    holder.rotation.y = (team === 'blue' ? .5 : -.5) + (ROT_FIX[name] || 0);
    holder.scale.setScalar(es1v1() ? CINE_1V1.escala : 1);
    scene.add(holder);
    if (es1v1()) ponerEtiqueta1v1(team, nombreDelJugador(team, player));
  } else if (es1v1()) {
    // R85b · 1v1: nada de podio. El campeón se queda reservado, fuera de la
    // escena, hasta que los dos lados tengan el suyo; entonces salen juntos,
    // cada uno directamente en su base.
    pending[team]++;
    holder.userData.pending = true;
    holder.userData.slot = 0;
    holder.position.set(0, 0, 0);
    holder.scale.setScalar(.01);
    holdersByTeam[team].push(holder);
    reserva1v1[team] = { holder, team, name, player, role };
    logUI(`⏳ Pick ${team === 'blue' ? '🔵' : '🔴'}: ${name} (esperando al otro)`)
    revelar1v1SiListo();
    return;
  } else {
    // El espacio se reserva al llegar, pero el modelo espera fuera de la escena.
    pending[team]++;
    holder.userData.pending = true;
    const iReservado = nextSlot(team, role ? slotForRole(role) : null, holder);
    holder.userData.slot = iReservado;
    holder.position.set(0, 0, 0);
    holder.scale.setScalar(.01);
    pickQueue.push({ holder, team, name, generation: draftGeneration });
  }
  holdersByTeam[team].push(holder);
  if (!instant) pumpPickQueue();
}

const ws = new WebSocket(`ws://${location.host}/?client=overlay`);
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'pick') showChampion(msg.team, msg.champion, false, msg.role, msg.player);
  if (msg.type === 'hover') pintarPreseleccion(msg);   // R97 · solo carta 2D, nunca 3D
  if (msg.type === 'bans-estado') pintarBans(msg.data);  // R97c · fila de baneos completa
  if (msg.type === 'role') setRole(msg.team, msg.champion, msg.role);
  if (msg.type === 'roster') applyRoster(msg.data);
  if (msg.type === 'timer') applyTimer(msg.data);
  if (msg.type === 'draftend') {
    draftEndRequested = true;
    setTimeout(finishDraftWhenReady, 4000);
  }
  if (msg.type === 'ban') {
    if (banCounters[msg.team] >= maxBaneos()) {
      logUI(`⚠️ Máximo 5 bans para el equipo ${msg.team === 'blue' ? 'azul' : 'rojo'}`);
    } else {
      fillBanBox(msg.team, msg.champion);
      logUI(`🚫 Ban ${msg.team === 'blue' ? '🔵' : '🔴'} (${banCounters[msg.team]}/${maxBaneos()}): ${msg.champion}`);
    }
  }
  if (msg.type === 'undo') {
    if (msg.itype === 'ban') {
      if (banCounters[msg.team] > 0) {
        banCounters[msg.team]--;
        document.querySelectorAll(`#${msg.team}Bans .bbox`)[banCounters[msg.team]].innerHTML = '';
      }
    } else {
      const holder = holdersByTeam[msg.team].pop();
      if (holder) {
        holder.userData.cancelled = true;
        if (reserva1v1[msg.team] && reserva1v1[msg.team].holder === holder) reserva1v1[msg.team] = null;
        if (es1v1()) quitarEtiqueta1v1(msg.team);
        if (holder.userData.pending) {
          holder.userData.pending = false;
          pending[msg.team] = Math.max(0, pending[msg.team] - 1);
          const qi = pickQueue.findIndex(entry => entry.holder === holder);
          if (qi >= 0) pickQueue.splice(qi, 1);
          if (activePick === holder) {
            activePick = null;
            setTimeout(pumpPickQueue, 0);
          }
        }
        if (holder.userData.target) counters[msg.team] = Math.max(0, counters[msg.team] - 1);
        scene.remove(holder);
      }
      const bx = [...document.querySelectorAll(`#${msg.team}Boxes .pbox`)].find(b => b.dataset.champ === msg.champion);
      if (bx) { delete bx.dataset.champ; const im = bx.querySelector('img:not(.preview)'); if (im) im.remove(); }
    }
    logUI('↩️ Última acción deshecha');
  }
  if (msg.type === 'info') applyInfo(msg.data);
  if (msg.type === 'score') applyScore(msg.data);
  if (msg.type === 'history') { renderUsed('blue', msg.data.blue); renderUsed('red', msg.data.red); }
  if (msg.type === 'clear') {
    // Los temporizadores de la selección anterior no deben modificar el draft nuevo.
    draftGeneration++;
    draftEndRequested = false;
    pickQueue.length = 0;
    activePick = null;
    Object.values(holdersByTeam).flat().forEach(h => { h.userData.cancelled = true; });
    [...scene.children].forEach(o => { if (o.name.startsWith('champ-')) scene.remove(o); });
    counters.blue = 0; counters.red = 0;
    pending.blue = 0; pending.red = 0;
    holdersByTeam.blue = []; holdersByTeam.red = [];
    draftDone = false;
    reserva1v1.blue = null; reserva1v1.red = null;
    quitarEtiqueta1v1('blue'); quitarEtiqueta1v1('red');
    cine = null;
    ['blue', 'red'].forEach(t => { if (teamLogoSprites[t]) { teamLogoSprites[t].visible = false; teamLogoSprites[t].material.opacity = 0; } });
    showOverlayChrome();
    clearBoxes();
    logUI('Listo para nuevo draft');
  }
  if (msg.type === 'init') {
    // R97 · al abrir el overlay se empieza sin preselecciones: solo cuenta el
    // estado guardado (los picks confirmados), que llegan como pick.
    document.querySelectorAll('.pbox img.preview').forEach(im => im.remove());
    document.querySelectorAll('.pbox.preview').forEach(b => b.classList.remove('preview'));
    preselecciones.blue.clear(); preselecciones.red.clear();
    showOverlayChrome();
    applyInfo(msg.state?.info);
    applyScore(msg.state?.score);
    applyRoster(msg.state?.roster);
    if (msg.state?.history) { renderUsed('blue', msg.state.history.blue); renderUsed('red', msg.state.history.red); }
    pintarBans(msg.state?.bans);   // R97b · la fila de baneos, completa
    (msg.state?.picks || []).forEach(p => showChampion(p.team, p.champion, true, p.role, p.player));
  }
};

// R97c · RED DE SEGURIDAD DE LOS BANEOS. Mientras la fila no esté completa se le
// pide la lista al servidor cada 4 s (como mucho 150 veces, 10 minutos). Si un
// baneo se pierde por lo que sea —o si el overlay se abre a mitad del draft—
// aparece igualmente. No toca nada más.
// Se pide la fila cada 4 s mientras dure el draft (hasta 10 minutos). Si la fila
// ya coincide, el repintado no hace nada, así que no hay parpadeo.
let pedidosDeBans = 0;
setInterval(() => {
  if (pedidosDeBans >= 150 || draftDone) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  pedidosDeBans++;
  ws.send(JSON.stringify({ type: 'pedir-bans' }));
}, 4000);

const clock = new THREE.Clock();
// (r72) TOPE DE FOTOGRAMAS. Antes se pintaba a lo que diera el monitor: en una
// pantalla de 144 Hz el draft pedía 144 fotogramas por segundo, y eso se come
// la tarjeta gráfica (y con ella el vídeo de Twitch y YouTube si están en otra
// pestaña). Ahora se pinta como mucho 60 veces por segundo.
// En OBS no cambia nada: la fuente de navegador ya pinta a 30 o 60.
// Se puede bajar con ?fps=30 en el enlace (útil para comprobar en el navegador
// sin tocar el archivo). Por defecto 60, que es lo que ya pinta OBS.
const fpsPedidos = Number((/[?&]fps=(\d+)/.exec(location.search) || [])[1]) || 60;
const FPS_MAXIMOS = Math.min(120, Math.max(5, fpsPedidos));
const MS_ENTRE_FOTOGRAMAS = 1000 / FPS_MAXIMOS;
// Margen de 2 ms: así en una pantalla de 60 Hz no se pierde ni un fotograma por
// decimales (16,67 ms llega justo) y en una de 144 Hz se pinta uno de cada tres.
const MARGEN_MS = 2;
let ultimoPintado = -MS_ENTRE_FOTOGRAMAS;
let fotogramasPintados = 0;   // solo para el cuadro de datos de abajo
(function tick(ahora) {
  requestAnimationFrame(tick);
  const t = typeof ahora === 'number' ? ahora : performance.now();
  if (t - ultimoPintado < MS_ENTRE_FOTOGRAMAS - MARGEN_MS) return;   // no toca todavía
  ultimoPintado = t;
  fotogramasPintados += 1;
  const dt = clock.getDelta();
  mixerHolder.forEach(m => m.update(dt));

  [rimBlue, rimRed].forEach(rim => {
    if (rim.userData.pulse > 0) {
      rim.userData.pulse = Math.max(0, rim.userData.pulse - dt / 1.6);
      rim.intensity = 300 + Math.sin(rim.userData.pulse * Math.PI) * 800;
    }
  });
  for (let i = fxWaves.length - 1; i >= 0; i--) {
    const w = fxWaves[i];
    w.userData.t += dt / 1.3;
    const t = w.userData.t;
    if (t >= 1) { scene.remove(w); fxWaves.splice(i, 1); continue; }
    w.scale.setScalar(1 + t * 7);
    w.material.opacity = .9 * (1 - t);
  }

  scene.traverse(o => {
    if (o.name.startsWith('champ-')) {
      // Normalización: escala + pies al suelo + centrado (con animación asentada)
      if (o.userData.normAt && performance.now() >= o.userData.normAt) {
        o.userData.normAt = false;
        const m = o.userData.normModel;
        if (m) {
          const sample = () => {
            o.updateMatrixWorld(true);
            const bones = new Map();
            m.traverse(n => {
              if (n.isSkinnedMesh) n.skeleton.bones.forEach(b => { if (!bones.has(b.uuid)) bones.set(b.uuid, b); });
            });
            const xs = [], ys = [], zs = [];
            const v = new THREE.Vector3();
            bones.forEach(b => { b.getWorldPosition(v); xs.push(v.x); ys.push(v.y); zs.push(v.z); });
            return { xs, ys, zs };
          };
          const pct = (arr, p) => { const a = [...arr].sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(a.length * p))]; };
          const s = o.scale.y || 1;
          let d = sample();
          const h = (pct(d.ys, .97) - pct(d.ys, .03)) / s;
          if (h > 0.0001) {
            m.scale.multiplyScalar((2.2 * (SCALE_FIX[o.userData.champName] || 1)) / h);
            d = sample();
            const medX = pct(d.xs, .5), medZ = pct(d.zs, .5);
            const cos = Math.cos(o.rotation.y), sin = Math.sin(o.rotation.y);
            const dx = (medX - o.position.x) / s, dz = (medZ - o.position.z) / s;
            // Corrección de posición SUAVE (sin "click"): se aplica gradual en el tick
            m.userData.fixTo = new THREE.Vector3(
              m.position.x - (dx * cos - dz * sin),
              m.position.y - (pct(d.ys, .05) - o.position.y + 0.15) / s,
              m.position.z - (dx * sin + dz * cos)
            );
          }
        }
      }
      // Acomodo suave de la corrección de posición
      if (o.userData.fixTo) {
        const mdl = o.userData.normModel;
        if (mdl) {
          mdl.position.lerp(o.userData.fixTo, 1 - Math.pow(0.005, dt));
          if (mdl.position.distanceTo(o.userData.fixTo) < 0.005) {
            mdl.position.copy(o.userData.fixTo);
            o.userData.fixTo = null;
          }
        } else o.userData.fixTo = null;
      }
      const escFinal = o.userData.escalaFinal || 1;
      if (o.scale.x < escFinal) o.scale.setScalar(Math.min(escFinal, o.scale.x + dt * 2.5));
      if (o.userData.target) {
        o.position.lerp(o.userData.target, 1 - Math.pow(0.02, dt));
        if (o.userData.targetRot !== undefined)
          o.rotation.y += (o.userData.targetRot - o.rotation.y) * (1 - Math.pow(0.02, dt));
        // El siguiente pick no entra hasta que este llegó realmente a su espacio.
        if (activePick === o && o.position.distanceTo(o.userData.target) < .01) {
          o.position.copy(o.userData.target);
          activePick = null;
          setTimeout(pumpPickQueue, 0);
        }
      }
    }
  });

  if (cine) {
    const phase = cine.phases[cine.phaseIndex];
    cine.phaseTime += dt;
    const t = Math.min(1, cine.phaseTime / phase.dur);
    const e = easeIO(t);

    if (phase.type === 'travel') {
      camera.position.lerpVectors(phase.fromPos, phase.toPos, e);
      const look = new THREE.Vector3().lerpVectors(phase.fromLook, phase.toLook, e);
      camera.lookAt(look);
    } else if (phase.type === 'pause') {
      camera.position.copy(phase.pos);
      camera.lookAt(phase.look);
      // Logo: fade in durante el primer segundo, visible, fade out durante el último segundo
      const sp = teamLogoSprites[phase.logo];
      if (sp) {
        sp.visible = true;
        const maxOpacity = 0.4;
        if (cine.phaseTime < 1.0) {
          sp.material.opacity = maxOpacity * (cine.phaseTime / 1.0);
        } else if (cine.phaseTime > phase.dur - 1.0) {
          sp.material.opacity = maxOpacity * ((phase.dur - cine.phaseTime) / 1.0);
        } else {
          sp.material.opacity = maxOpacity;
        }
      }
    }

    // Avanzar de fase
    if (t >= 1) {
      // Ocultar logo de la fase actual si lo había
      if (phase.logo && teamLogoSprites[phase.logo]) {
        teamLogoSprites[phase.logo].material.opacity = 0;
        teamLogoSprites[phase.logo].visible = false;
      }
      cine.phaseIndex++;
      cine.phaseTime = 0;
      // ¿Terminó la última fase?
      if (cine.phaseIndex >= cine.phases.length) {
        camera.position.copy(cine.startPos);
        controls.target.copy(cine.startTarget);
        controls.enabled = true;
        cine = null;
        showOverlayChrome();
      }
    }
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
})();
// (r72) Con ?datos=1 en el enlace se enseña un cuadro con lo que cuesta el
// draft: fotogramas por segundo de verdad, píxeles por punto, llamadas de
// dibujo y triángulos. Sin ese ?datos no se ve nada y no cambia nada.
if (/[?&]datos/.test(location.search)) {
  const cuadro = document.createElement('div');
  cuadro.style.cssText = 'position:fixed;top:8px;left:8px;z-index:9999;' +
    'font:12px/1.45 ui-monospace,monospace;background:rgba(0,0,0,.75);color:#9fe0ff;' +
    'padding:7px 10px;border-radius:7px;white-space:pre;pointer-events:none';
  document.body.appendChild(cuadro);
  let previos = fotogramasPintados;
  let cuando = performance.now();
  setInterval(() => {
    const ahora = performance.now();
    const fps = ((fotogramasPintados - previos) * 1000) / Math.max(1, ahora - cuando);
    previos = fotogramasPintados;
    cuando = ahora;
    const info = renderer.info.render;
    cuadro.textContent =
      `FPS de pintado: ${fps.toFixed(1)}  (tope ${FPS_MAXIMOS})\n` +
      `píxeles por punto: ${renderer.getPixelRatio().toFixed(2)}\n` +
      `llamadas de dibujo: ${info.calls}\n` +
      `triángulos: ${info.triangles}`;
  }, 500);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  fitBar();
});

// ===== PATROCINADORES: un logo a cada lado del logo del torneo =====
// El panel de control manda el enlace de cada uno: puede ser un archivo subido
// desde el panel (llega como /uploads/...) o una URL de internet. Las dos
// formas valen igual. Si el panel no manda nada, se usa el archivo de la
// carpeta  draft/public/patrocinadores/izquierda.png  y  derecha.png
// (tambien valen .webp, .jpg, .jpeg y .svg). Si no hay nada, el hueco no se ve
// y el draft queda exactamente como estaba. No se mueve nada.
const EXTENSIONES_PATROCINADOR = ['png', 'webp', 'jpg', 'jpeg', 'svg'];
const PATROCINADORES = [
  { id: 'sponsorLeft', archivo: 'izquierda', campo: 'sponsorIzquierda' },
  { id: 'sponsorRight', archivo: 'derecha', campo: 'sponsorDerecha' }
];
const patrocinadorPuesto = { sponsorLeft: null, sponsorRight: null };
function ponerPatrocinador(id, url) {
  const hueco = document.getElementById(id);
  if (!hueco) return;
  if (!url) {
    hueco.innerHTML = ''; hueco.classList.remove('on'); patrocinadorPuesto[id] = null; return;
  }
  if (patrocinadorPuesto[id] === url) return;      // ya esta puesto: no se recarga
  patrocinadorPuesto[id] = url;
  const img = new Image();
  img.alt = 'Patrocinador';
  img.onload = () => { hueco.innerHTML = ''; hueco.appendChild(img); hueco.classList.add('on'); };
  img.onerror = () => { hueco.innerHTML = ''; hueco.classList.remove('on'); patrocinadorPuesto[id] = null; };
  img.src = url;
}
function patrocinadorPorDefecto(id, nombre) {
  if (patrocinadorPuesto[id]) return;
  let intento = 0;
  const probar = () => {
    if (intento >= EXTENSIONES_PATROCINADOR.length) return;   // sin archivo: no se muestra nada
    const url = `patrocinadores/${nombre}.${EXTENSIONES_PATROCINADOR[intento]}`;
    const img = new Image();
    img.onload = () => { if (!patrocinadorPuesto[id]) ponerPatrocinador(id, url); };
    img.onerror = () => { intento += 1; probar(); };
    img.src = url;
  };
  probar();
}
for (const p of PATROCINADORES) patrocinadorPorDefecto(p.id, p.archivo);
</script>
