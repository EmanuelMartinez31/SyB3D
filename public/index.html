<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Operador - Draft 3D</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
  h1 { font-size: 20px; } h2 { font-size: 14px; color: #8b949e; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; max-width: 1000px; margin: 0 auto; }
  .champ { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: .15s; position: relative; }
  .champ:hover { border-color: #58a6ff; transform: translateY(-3px); background: #1c2330; }
  .champ img { width: 72px; height: 72px; border-radius: 8px; margin-bottom: 6px; }
  .champ span { font-size: 12px; text-align: center; }
  /* Campeones bloqueados por fearless draft */
  .champ.used { opacity: .3; filter: saturate(.3); }
  .champ.used::before { content: '🔒'; position: absolute; top: 4px; right: 6px; font-size: 16px; }
  .champ.used:hover { border-color: #f85149; transform: none; }
  .row { display: flex; gap: 12px; margin: 16px 0; align-items: center; flex-wrap: wrap; }
  select, button, input { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  input { cursor: text; min-width: 220px; }
  button:hover { border-color: #58a6ff; }
  .danger { border-color: #f85149; color: #f85149; }
  #log { max-width: 900px; height: 100px; overflow-y: auto; background: #010409; border: 1px solid #30363d; border-radius: 8px; padding: 8px; font-family: monospace; font-size: 12px; color: #7ee787; }
  #phaseBanner { font-size: 22px; font-weight: 800; padding: 14px 20px; border-radius: 12px; background: #161b22; border: 2px solid #58a6ff; letter-spacing: .5px; }
  #scoreDisplay { font-size: 20px; font-weight: 800; padding: 8px 18px; background: #161b22; border: 1px solid #30363d; border-radius: 10px; }
</style>
</head>
<body>
<h1>🎛️ Panel de Operador — Draft 3D LoL</h1>

<div class="row">
  <div id="phaseBanner">Cargando...</div>
</div>

<div class="row">
  <label>Modo:</label>
  <select id="mode">
    <option value="guided">🎯 Guiado (orden oficial)</option>
    <option value="manual">🔧 Manual</option>
  </select>
  <label>Equipo (solo manual):</label>
  <select id="team"><option value="blue">🔵 Azul</option><option value="red">🔴 Rojo</option></select>
  <button onclick="prevPhase()">◀ Deshacer</button>
  <button class="danger" onclick="resetDraft()">🔄 Siguiente juego (limpia draft)</button>
</div>

<h2>Marcador de serie</h2>
<div class="row">
  <select id="boFormat" onchange="sendScore()">
    <option value="BO1">BO1</option>
    <option value="BO3" selected>BO3</option>
    <option value="BO5">BO5</option>
  </select>
  <span id="scoreDisplay">🔵 0 — 0 🔴</span>
  <button onclick="addScore('blue')">🔵 +1 victoria</button>
  <button onclick="addScore('red')">🔴 +1 victoria</button>
  <button onclick="resetScore()">↺ Reset marcador</button>
  <button class="danger" onclick="resetAll()">⚠️ Reset serie completa</button>
  <button id="fearlessBtn" onclick="toggleFearless()">😈 Fearless: ON</button>
  <button id="lcuBtn" onclick="toggleLCU()">⚡ AUTO (LCU): OFF</button>
</div>

<h2>Info del torneo</h2>
<div class="row">
  <input id="tName" placeholder="Nombre del torneo" style="min-width:180px">
  <input id="blueName" placeholder="Equipo azul" style="min-width:140px">
  <input id="redName" placeholder="Equipo rojo" style="min-width:140px">
  <input id="logoUrl" placeholder="URL del logo" style="min-width:220px">
  <input id="bgUrl" placeholder="URL fondo (imagen o video .mp4)" style="min-width:220px">
  <button onclick="sendInfo()">📢 Enviar info al overlay</button>
</div>

<h2>Buscar campeón (Enter = enviar según el turno)</h2>
<div class="row">
  <select id="roleSel">
    <option value="TOP">TOP</option>
    <option value="JUNGLE">JG</option>
    <option value="MIDDLE" selected>MID</option>
    <option value="BOTTOM">ADC</option>
    <option value="UTILITY">SUP</option>
  </select>
  <button onclick="assignRole()">🏷️ Línea al último pick</button>
  <input id="search" placeholder="Escribe el nombre del campeón..." autocomplete="off">
</div>

<h2>Campeones (los 🔒 ya se jugaron — fearless)</h2>
<div class="grid" id="champGrid"></div>

<h2>Log</h2>
<div id="log"></div>

<script>
const CHAMPS = ['Aatrox', 'Ahri', 'Akali', 'Akshan', 'Alistar', 'Ambessa', 'Amumu', 'Anivia', 'Annie', 'Aphelios', 'Ashe', 'Aurelion Sol', 'Aurora', 'Azir', 'Bard', "Bel'Veth", 'Blitzcrank', 'Brand', 'Braum', 'Briar', 'Caitlyn', 'Camille', 'Cassiopeia', "Cho'Gath", 'Corki', 'Darius', 'Diana', 'Dr. Mundo', 'Draven', 'Ekko', 'Elise', 'Evelynn', 'Ezreal', 'Fiddlesticks', 'Fiora', 'Fizz', 'Galio', 'Gangplank', 'Garen', 'Gnar', 'Gragas', 'Graves', 'Gwen', 'Hecarim', 'Heimerdinger', 'Hwei', 'Illaoi', 'Irelia', 'Ivern', 'Janna', 'Jarvan IV', 'Jax', 'Jayce', 'Jhin', 'Jinx', "K'Sante", "Kai'Sa", 'Kalista', 'Karma', 'Karthus', 'Kassadin', 'Katarina', 'Kayle', 'Kayn', 'Kennen', "Kha'Zix", 'Kindred', 'Kled', "Kog'Maw", 'LeBlanc', 'Lee Sin', 'Leona', 'Lillia', 'Lissandra', 'Locke', 'Lucian', 'Lulu', 'Lux', 'Malphite', 'Malzahar', 'Maokai', 'Master Yi', 'Mel', 'Milio', 'Miss Fortune', 'Mordekaiser', 'Morgana', 'Naafiri', 'Nami', 'Nasus', 'Nautilus', 'Neeko', 'Nidalee', 'Nilah', 'Nocturne', 'Nunu & Willump', 'Olaf', 'Orianna', 'Ornn', 'Pantheon', 'Poppy', 'Pyke', 'Qiyana', 'Quinn', 'Rakan', 'Rammus', "Rek'Sai", 'Rell', 'Renata Glasc', 'Renekton', 'Rengar', 'Riven', 'Rumble', 'Ryze', 'Samira', 'Sejuani', 'Senna', 'Seraphine', 'Sett', 'Shaco', 'Shen', 'Shyvana', 'Singed', 'Sion', 'Sivir', 'Skarner', 'Smolder', 'Sona', 'Soraka', 'Swain', 'Sylas', 'Syndra', 'Tahm Kench', 'Taliyah', 'Talon', 'Taric', 'Teemo', 'Thresh', 'Tristana', 'Trundle', 'Tryndamere', 'Twisted Fate', 'Twitch', 'Udyr', 'Urgot', 'Varus', 'Vayne', 'Veigar', "Vel'Koz", 'Vex', 'Vi', 'Viego', 'Viktor', 'Vladimir', 'Volibear', 'Warwick', 'Wukong', 'Xayah', 'Xerath', 'Xin Zhao', 'Yasuo', 'Yone', 'Yorick', 'Yuumi', 'Zac', 'Zed', 'Zeri', 'Ziggs', 'Zilean', 'Zoe', 'Zyra'];

const PHASES = [
  {team:'blue', type:'ban'},  {team:'red', type:'ban'},
  {team:'blue', type:'ban'},  {team:'red', type:'ban'},
  {team:'blue', type:'ban'},  {team:'red', type:'ban'},
  {team:'blue', type:'pick'}, {team:'red', type:'pick'},
  {team:'red', type:'pick'},  {team:'blue', type:'pick'},
  {team:'blue', type:'pick'}, {team:'red', type:'pick'},
  {team:'red', type:'ban'},   {team:'blue', type:'ban'},
  {team:'red', type:'ban'},   {team:'blue', type:'ban'},
  {team:'red', type:'pick'},  {team:'blue', type:'pick'},
  {team:'blue', type:'pick'}, {team:'red', type:'pick'}
];
let phaseIdx = 0;

const ws = new WebSocket(`ws://${location.host}`);
const log = (m) => { const el = document.getElementById('log'); el.innerHTML += m + "<br>"; el.scrollTop = el.scrollHeight; };
ws.onopen = () => log("✅ Conectado al servidor");
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'pick') lastPick = { team: msg.team, champion: msg.champion };
  if (msg.type === 'history') return markUsed(msg.data);
  if (msg.type === 'init') {
    if (msg.state?.history) markUsed(msg.state.history);
    phaseIdx = (msg.state?.picks?.length || 0) + (msg.state?.bans?.length || 0);
    updateBanner();
    log(`📍 Reanudando en el paso ${Math.min(phaseIdx + 1, 20)}/20`);
    return;
  }
  if ((msg.type === 'pick' || msg.type === 'ban') && msg.auto) {
    log(`⚡ AUTO → ${msg.type.toUpperCase()} ${msg.team === 'blue' ? '🔵' : '🔴'} ${msg.champion}`);
    if (document.getElementById('mode').value === 'guided' && phaseIdx < 20) { phaseIdx++; updateBanner(); }
    return;
  }
  log("📡 " + e.data);
};

function send(msg) { ws.readyState === 1 ? ws.send(JSON.stringify(msg)) : log("⚠️ No conectado aún"); }

const NAME_TO_ID = {
  "Aurelion Sol": "AurelionSol", "Bel'Veth": "Belveth", "Cho'Gath": "Chogath",
  "Dr. Mundo": "DrMundo", "Jarvan IV": "JarvanIV",
  "K'Sante": "KSante", "Kai'Sa": "Kaisa", "Kha'Zix": "Khazix",
  "Kog'Maw": "KogMow", "LeBlanc": "Leblanc", "Lee Sin": "LeeSin",
  "Master Yi": "MasterYi", "Miss Fortune": "MissFortune", "Nunu & Willump": "Nunu",
  "Rek'Sai": "RekSai", "Renata Glasc": "Renata", "Tahm Kench": "TahmKench",
  "Twisted Fate": "TwistedFate", "Vel'Koz": "Velkoz", "Wukong": "MonkeyKing"
};
function champId(name) {
  if (NAME_TO_ID[name]) return NAME_TO_ID[name];
  return name.charAt(0).toUpperCase() + name.slice(1).replace(/[^a-zA-Z0-9]/g, '');
}
let ddragonVer = null;
fetch('https://ddragon.leagueoflegends.com/api/versions.json')
  .then(r => r.json()).then(v => { ddragonVer = v[0]; loadIcons(); }).catch(() => loadIcons());

// ===== Fearless draft: campeones ya usados =====
let usedSet = new Set();
const tiles = {};
function markUsed(h) {
  if (!h) return;
  usedSet = new Set([...(h.blue || []), ...(h.red || [])]);
  CHAMPS.forEach(c => { if (tiles[c]) tiles[c].classList.toggle('used', usedSet.has(c)); });
}

function currentPhase() { return PHASES[phaseIdx] || null; }

function updateBanner() {
  const b = document.getElementById('phaseBanner');
  const p = currentPhase();
  if (!p) { b.innerHTML = '🏁 DRAFT FINALIZADO — usa 🔄 para el siguiente juego'; b.style.borderColor = '#7ee787'; return; }
  const teamTxt = p.team === 'blue' ? '🔵 AZUL' : '🔴 ROJO';
  const typeTxt = p.type === 'ban' ? 'BANEO' : 'SELECCIÓN';
  b.innerHTML = `PASO ${phaseIdx + 1}/20 — ${teamTxt}: ${typeTxt}`;
  b.style.borderColor = p.team === 'blue' ? '#3b82f6' : '#ef4444';
}
updateBanner();

function doAction(champion, forcedType) {
  if (fearlessOn && usedSet.has(champion)) return log(`⛔ ${champion} ya fue usado — FEARLESS DRAFT, no se puede repetir`);
  if (document.getElementById('mode').value === 'manual') {
    send({ type: forcedType || 'pick', team: document.getElementById('team').value, champion });
    return;
  }
  const p = currentPhase();
  if (!p) return log('🏁 El draft ya terminó. Presiona 🔄 para el siguiente juego.');
  send({ type: p.type, team: p.team, champion });
  phaseIdx++;
  updateBanner();
}

function prevPhase() {
  if (phaseIdx > 0) {
    const last = PHASES[phaseIdx - 1];
    phaseIdx--;
    send({ type: 'undo', team: last.team, itype: last.type });
    updateBanner();
    log('↩️ Última acción deshecha en el overlay');
  }
}
function resetDraft() {
  phaseIdx = 0; updateBanner(); send({ type: 'clear' });
  log('🔄 Siguiente juego — draft limpio, usados archivados para fearless');
}

const score = { format: 'BO3', blue: 0, red: 0 };
function maxWins() { return score.format === 'BO5' ? 3 : score.format === 'BO3' ? 2 : 1; }
function updateScoreDisplay() {
  document.getElementById('scoreDisplay').innerHTML = `🔵 ${score.blue} — ${score.red} 🔴`;
}
function sendScore() {
  score.format = document.getElementById('boFormat').value;
  send({ type: 'score', data: { ...score } });
  updateScoreDisplay();
  log(`🏆 Marcador: ${score.format} — ${score.blue} vs ${score.red}`);
}
function addScore(team) {
  if (score[team] >= maxWins()) return log(`⚠️ ${score.format}: máximo ${maxWins()} victorias por equipo`);
  score[team]++;
  sendScore();
}
function resetAll() {
  if (!confirm('¿Resetear TODA la serie? Se limpiará el draft, el marcador y los campeones usados (fearless).')) return;
  score.blue = 0; score.red = 0;
  phaseIdx = 0;
  updateScoreDisplay(); updateBanner();
  usedSet = new Set();
  CHAMPS.forEach(c => { if (tiles[c]) tiles[c].classList.remove('used'); });
  send({ type: 'resetall' });
  log('⚠️ Serie completa reseteada — listo para una serie nueva');
}
function resetScore() {
  score.blue = 0; score.red = 0;
  sendScore();
}

let lastPick = null;
function assignRole() {
  if (!lastPick) return log('⚠️ Aún no hay ningún pick');
  send({ type: 'role', team: lastPick.team, champion: lastPick.champion, role: document.getElementById('roleSel').value });
  log(`🏷️ ${document.getElementById('roleSel').value} → ${lastPick.champion}`);
}
let lcuOn = false;
function toggleLCU() {
  lcuOn = !lcuOn;
  send({ type: 'lcu', action: lcuOn ? 'start' : 'stop' });
  document.getElementById('lcuBtn').textContent = `⚡ AUTO (LCU): ${lcuOn ? 'ON' : 'OFF'}`;
  log(lcuOn ? '⚡ Automático activado — abre el cliente de LoL y entra a champ select' : '⚡ Automático desactivado — control 100% manual');
}
let fearlessOn = true;
function toggleFearless() {
  fearlessOn = !fearlessOn;
  document.getElementById('fearlessBtn').textContent = `😈 Fearless: ${fearlessOn ? 'ON' : 'OFF'}`;
  send({ type: 'fearless', on: fearlessOn });
  if (!fearlessOn) {
    usedSet = new Set();
    CHAMPS.forEach(c => { if (tiles[c]) tiles[c].classList.remove('used'); });
  }
  log(fearlessOn ? '😈 Fearless ON — los picks se archivarán entre juegos' : '😇 Fearless OFF — se pueden repetir campeones, usados ocultos');
}

function sendInfo() {
  send({ type: 'info', data: {
    tournament: document.getElementById('tName').value,
    blue: document.getElementById('blueName').value,
    red: document.getElementById('redName').value,
    logo: document.getElementById('logoUrl').value,
    bg: document.getElementById('bgUrl').value
  }});
  log("📢 Info del torneo enviada");
}

function manualAction() {
  const name = document.getElementById('search').value.trim();
  if (!name) return log("⚠️ Escribe un nombre primero");
  doAction(name);
  document.getElementById('search').value = "";
}
document.getElementById('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') manualAction(); });

function loadIcons() {
  const grid = document.getElementById('champGrid');
  const ver = ddragonVer || '15.1.1';
  CHAMPS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'champ';
    const img = document.createElement('img');
    img.src = `https://ddragon.leagueoflegends.com/cdn/${ver}/img/champion/${champId(c)}.png`;
    img.onerror = () => { img.remove(); };
    d.appendChild(img);
    const nm = document.createElement('span');
    nm.textContent = c;
    d.appendChild(nm);
    d.onclick = (e) => doAction(c, e.shiftKey ? 'ban' : undefined);
    grid.appendChild(d);
    tiles[c] = d;
  });
}
</script>
</body>
</html>
