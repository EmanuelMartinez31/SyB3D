<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- Los recursos se cargan localmente; Three.js no depende de una CDN. -->
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SyB — Resumen postpartida</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/overlay/vendor/three/build/three.module.js",
          "three/addons/": "/overlay/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="stage" hidden aria-label="Resumen de estadísticas postpartida">
      <div class="topline"></div>
      <!-- Encabezado: torneo, título y formato de serie. -->
      <header class="header">
        <div class="brand">
          <img class="tournament-logo" id="tournament-logo" alt="" hidden>
          <span id="tournament-name"></span>
        </div>
        <div class="title">
          <small>ANÁLISIS FINAL</small>
          <div class="title-row">
            <img class="title-logo" id="blue-logo" alt="" hidden />
            <h1>RESUMEN DE PARTIDA</h1>
            <img class="title-logo" id="red-logo" alt="" hidden />
          </div>
        </div>
        <div class="meta"><b id="series-format">BO3 · JUEGO 1</b></div>
      </header>

      <!-- Equipo azul: render.js coloca aquí los datos y crea sus cinco tarjetas. -->
      <div class="cards" id="blue-cards"></div>

      <!-- Barra única del centro: equipo azul a la izquierda, rojo a la derecha,
           marcador y duración en medio. -->
      <section class="midbar" aria-label="Resumen de la partida">
        <div class="mid-side left">
          <span class="mid-tag" id="blue-tag">AZUL</span>
          <span class="mid-team">
            <strong id="blue-name">EQUIPO AZUL</strong>
            <small>LADO AZUL</small>
          </span>
          <span class="mid-result win" id="blue-result">VICTORIA</span>
        </div>
        <div class="mid-center">
          <div class="mid-score">
            <strong id="blue-kills">0</strong><span>—</span><strong id="red-kills">0</strong>
          </div>
          <div class="mid-duration"><small>DURACIÓN</small><strong id="game-duration">00:00</strong></div>
        </div>
        <div class="mid-side right">
          <span class="mid-result loss" id="red-result">DERROTA</span>
          <span class="mid-team">
            <strong id="red-name">EQUIPO ROJO</strong>
            <small>LADO ROJO</small>
          </span>
          <span class="mid-tag" id="red-tag">ROJO</span>
        </div>
      </section>

      <!-- Equipo rojo: misma estructura y estilos, con sus colores. -->
      <div class="cards redcards" id="red-cards"></div>

      <!-- Un solo canvas WebGL dibuja los diez campeones sobre sus respectivas tarjetas. -->
      <canvas id="webgl" aria-hidden="true"></canvas>
      <div id="demo-badge" hidden>DEMO · DATOS FICTICIOS</div>
    </main>
    <!-- Punto de entrada: obtiene el estado, construye las tarjetas y sincroniza los modelos. -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
